<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>千浩翻译</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">译</div>
        <div>
          <h1>千浩翻译</h1>
          <p>Kilocean · 双语对照整页翻译，划词即译</p>
        </div>
      </header>

      <section class="panel" aria-labelledby="settings-title">
        <div class="section-heading">
          <h2 id="settings-title">连接设置</h2>
          <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noreferrer">获取 Key</a>
        </div>

        <label class="field">
          <span>DeepSeek API Key</span>
          <span class="password-wrap">
            <input id="api-key" type="password" autocomplete="off" placeholder="sk-…" spellcheck="false">
            <button id="toggle-key" class="icon-button" type="button" aria-label="显示 API Key">显示</button>
          </span>
        </label>

        <div class="field-grid">
          <label class="field">
            <span>翻译为</span>
            <select id="target-language">
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="en">English</option>
            </select>
          </label>

          <label class="field">
            <span>模型</span>
            <select id="model">
              <option value="deepseek-v4-flash">V4 Flash · 快</option>
              <option value="deepseek-v4-pro">V4 Pro · 准</option>
            </select>
          </label>
        </div>

        <button id="test-connection" class="text-button" type="button">测试 API 连接</button>
      </section>

      <section class="panel display-panel" aria-labelledby="display-title">
        <div class="section-heading">
          <h2 id="display-title">显示模式</h2>
          <span class="hint">默认双语对照</span>
        </div>
        <div class="mode-toggle" role="radiogroup" aria-label="显示模式">
          <button id="mode-bilingual" class="mode-button" type="button" role="radio" aria-checked="true" data-mode="bilingual">双语对照</button>
          <button id="mode-translation" class="mode-button" type="button" role="radio" aria-checked="false" data-mode="translation-only">仅译文</button>
          <button id="mode-original" class="mode-button" type="button" role="radio" aria-checked="false" data-mode="original">原文</button>
        </div>
        <p class="mode-help">双语对照 / 仅译文 / 原文可随时切换；“清除译文”会彻底还原并停止跟译。划词选中即可弹出译文。</p>
      </section>

      <section id="selection-confirm-panel" class="panel selection-confirm-panel" hidden aria-labelledby="selection-confirm-title">
        <div class="section-heading">
          <h2 id="selection-confirm-title">划词待确认</h2>
          <span class="hint">扩展内确认，不走网页按钮</span>
        </div>
        <p id="selection-confirm-text" class="selection-confirm-text"></p>
        <div class="selection-confirm-actions">
          <button id="selection-confirm-btn" class="primary-button" type="button">
            <span>翻译选中文本</span>
            <span aria-hidden="true">→</span>
          </button>
          <button id="selection-confirm-dismiss" class="secondary-button" type="button">取消</button>
        </div>
      </section>

      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <div>
          <strong id="status-title">准备就绪</strong>
          <p id="status-detail">点击下方按钮开始翻译当前网页</p>
        </div>
      </section>

      <div class="actions">
        <button id="translate" class="primary-button" type="button">
          <span>翻译当前网页</span>
          <span aria-hidden="true">→</span>
        </button>
        <button id="restore" class="secondary-button" type="button">清除译文</button>
      </div>

      <section class="export-panel" aria-labelledby="export-title">
        <div class="export-heading">
          <h2 id="export-title">保存与分享</h2>
          <span>完成翻译后可用</span>
        </div>
        <div class="export-actions">
          <button id="export-html" class="utility-button" type="button" disabled>保存 HTML</button>
          <button id="print-pdf" class="utility-button" type="button" disabled>打印 / 保存 PDF</button>
        </div>
        <p>HTML 会保留当前译文和原页面样式；PDF 将打开 Chrome 打印窗口。</p>
      </section>

      <p class="privacy-note">API Key 仅保存在本机 Chrome 中。网页文本会发送至 DeepSeek 完成翻译。无登录、无会员墙。</p>
    </main>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
