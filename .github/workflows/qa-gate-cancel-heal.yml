# Copy alongside qa-gate.yml on the default branch.
# A workflow cannot listen to itself; this companion heals the source gate.
name: QA Gate Cancel Heal

on:
  workflow_run:
    workflows: ["QA Gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: qa-cancel-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  qa-cancel-heal:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'cancelled' &&
      github.event.workflow_run.event != 'push'
    # Same ceiling as the `qa` job: GitHub checks EVERY job of the called
    # file against this job's ceiling (incl. the evaluator, which needs
    # pull-requests/issues write for label stripping); the refresh path
    # itself narrows to actions: write.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@bdef292fb1bbd35fc6624ce784f7e052191f4aff # devflow-gates main @ bdef292
    with:
      qa_label: 'qa-passed'   # keep in sync with the `if:` above and qa-label-ack
