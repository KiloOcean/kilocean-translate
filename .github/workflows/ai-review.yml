name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================
  # PRIMARY: GitHub Copilot Code Review
  # No API key required - uses your Copilot subscription
  # Configure auto-review: Settings → Copilot → Code review
  # ============================================================
  copilot-review:
    name: Copilot Review
    runs-on: ubuntu-latest
    if: vars.DISABLE_COPILOT_REVIEW != 'true'
    
    steps:
      - name: Request Copilot Code Review
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            
            try {
              // Request review from GitHub Copilot code review bot
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['copilot-pull-request-reviewer']
              });
              core.info('✅ Copilot code review requested successfully');
              core.exportVariable('COPILOT_REQUESTED', 'true');
            } catch (error) {
              if (error.status === 422) {
                // Copilot may not be enabled or already requested
                core.info('ℹ️ Copilot review could not be requested (may already be assigned or not enabled)');
                core.info('Enable at: Settings → Copilot → Code review');
              } else {
                core.warning(`Copilot review request failed: ${error.message}`);
              }
              core.exportVariable('COPILOT_REQUESTED', 'false');
            }

      - name: Job Summary
        run: |
          echo "## 🤖 GitHub Copilot Code Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$COPILOT_REQUESTED" = "true" ]; then
            echo "✅ Copilot review has been requested for this PR." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Copilot review request skipped (may already be assigned or not configured)." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Enable Automatic Copilot Reviews" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No API key required — uses your GitHub Copilot subscription:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Settings → Copilot → Code review**" >> $GITHUB_STEP_SUMMARY
          echo "2. Under Branch rules: **Automatically request Copilot review**" >> $GITHUB_STEP_SUMMARY
          echo "3. Choose effort level:" >> $GITHUB_STEP_SUMMARY
          echo "   - **Lite**: Standard review" >> $GITHUB_STEP_SUMMARY
          echo "   - **Balanced**: Deeper analysis of complex/security-sensitive code" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📖 [Documentation](https://docs.github.com/en/copilot/concepts/agents/code-review)" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # OPTIONAL: Custom LLM Review (DeepSeek/OpenAI/xAI)
  # Only runs if API key is configured - skips cleanly otherwise
  # This is supplementary to Copilot, not required for merge
  # ============================================================
  custom-llm-review:
    name: Custom LLM Review (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    env:
      AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER || 'deepseek' }}
      AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || '' }}
    
    steps:
      - name: Check for API Key
        id: check-key
        run: |
          PROVIDER="${{ env.AI_REVIEW_PROVIDER }}"
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT
          
          HAS_KEY=false
          case "$PROVIDER" in
            openai)
              [ -n "${{ secrets.OPENAI_API_KEY }}" ] && HAS_KEY=true
              [ -n "${{ secrets.AI_REVIEW_API_KEY }}" ] && HAS_KEY=true
              ;;
            deepseek)
              [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ] && HAS_KEY=true
              [ -n "${{ secrets.AI_REVIEW_API_KEY }}" ] && HAS_KEY=true
              ;;
            xai|grok)
              [ -n "${{ secrets.XAI_API_KEY }}" ] && HAS_KEY=true
              [ -n "${{ secrets.AI_REVIEW_API_KEY }}" ] && HAS_KEY=true
              ;;
            *)
              [ -n "${{ secrets.AI_REVIEW_API_KEY }}" ] && HAS_KEY=true
              ;;
          esac
          echo "has_key=$HAS_KEY" >> $GITHUB_OUTPUT

      - name: Skip Notice
        if: steps.check-key.outputs.has_key != 'true'
        run: |
          echo "## Custom LLM Review — Skipped ⏭️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No API key configured. This is **optional** and supplementary to Copilot." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Optional: Enable Custom LLM Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Add a secret in **Settings → Secrets → Actions**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Provider | Secret Name | Default Model |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| DeepSeek | \`DEEPSEEK_API_KEY\` | deepseek-chat |" >> $GITHUB_STEP_SUMMARY
          echo "| OpenAI | \`OPENAI_API_KEY\` | gpt-4o-mini |" >> $GITHUB_STEP_SUMMARY
          echo "| xAI (Grok) | \`XAI_API_KEY\` | grok-2-latest |" >> $GITHUB_STEP_SUMMARY

      - name: Checkout
        if: steps.check-key.outputs.has_key == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        if: steps.check-key.outputs.has_key == 'true'
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
          # Truncate large diffs (8000 chars for context window)
          if [ $(wc -c < pr_diff.txt) -gt 8000 ]; then
            head -c 8000 pr_diff.txt > pr_diff_truncated.txt
            echo -e "\n... [truncated]" >> pr_diff_truncated.txt
            mv pr_diff_truncated.txt pr_diff.txt
          fi
          
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "files_count=$(wc -l < changed_files.txt)" >> $GITHUB_OUTPUT

      - name: Run LLM Review
        if: steps.check-key.outputs.has_key == 'true'
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PROVIDER="${{ env.AI_REVIEW_PROVIDER }}"
          MODEL="${{ env.AI_REVIEW_MODEL }}"
          
          case "$PROVIDER" in
            openai)
              API_URL="https://api.openai.com/v1/chat/completions"
              API_KEY="${OPENAI_API_KEY:-$AI_REVIEW_API_KEY}"
              MODEL="${MODEL:-gpt-4o-mini}"
              ;;
            deepseek)
              API_URL="https://api.deepseek.com/v1/chat/completions"
              API_KEY="${DEEPSEEK_API_KEY:-$AI_REVIEW_API_KEY}"
              MODEL="${MODEL:-deepseek-chat}"
              ;;
            xai|grok)
              API_URL="https://api.x.ai/v1/chat/completions"
              API_KEY="${XAI_API_KEY:-$AI_REVIEW_API_KEY}"
              MODEL="${MODEL:-grok-2-latest}"
              ;;
            *)
              echo "Unknown provider: $PROVIDER"; exit 1 ;;
          esac
          
          echo "Using $PROVIDER ($MODEL)"
          
          SYSTEM_PROMPT="You are a code reviewer for Kilocean Translate, a Chrome/Edge MV3 extension (DeepSeek BYOK). Provide structured bilingual feedback (中文 | English).

          Product context:
          - Files: manifest.json, background.js, content.js, popup.js/html/css, shared.js
          - Features: bilingual page display, selection (划词) translate, displayMode sync via chrome.storage
          - Permissions must stay minimal: activeTab, scripting, storage; host only https://api.deepseek.com/*
          - API key is user-provided BYOK — never log or exfiltrate secrets

          Focus on:
          1. 🔒 Security (API key handling, XSS via injected DOM, permission creep, host permissions)
          2. 🐛 Bugs (selection race tokens, late async responses after close, displayMode vs storage drift, MutationObserver loops)
          3. ⚡ Performance (DOM thrash, observer churn, unbounded translation queues)
          4. 🧪 Missing checks (scripts/ci-check.mjs coverage, permission whitelist)
          5. 🧩 Extension risks (CSP, chrome:// pages, content-script inject races)

          Format:
          ## 🤖 Custom LLM Review | 自定义 LLM 审查

          ### Summary | 概要
          (Brief bilingual overview)

          ### Findings | 发现
          (Issues with bilingual descriptions)

          ### Risk | 风险
          - [ ] High | 高
          - [ ] Medium | 中  
          - [x] Low | 低"

          # Build the request with jq so PR titles/diffs with quotes/newlines stay valid JSON.
          PAYLOAD=$(jq -n \
            --arg model "$MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --arg title "$PR_TITLE" \
            --rawfile files changed_files.txt \
            --rawfile diff pr_diff.txt \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: ("Review PR: " + $title + "\n\nFiles:\n" + $files + "\n\nDiff:\n```\n" + $diff + "\n```")}
              ],
              max_tokens: 1500,
              temperature: 0.3
            }')

          RESPONSE=$(curl -s -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$PAYLOAD")
          
          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          
          if [ -z "$CONTENT" ]; then
            echo "API Error: $RESPONSE"
            echo "review_ok=false" >> $GITHUB_OUTPUT
          else
            echo "$CONTENT" > review.md
            echo -e "\n---\n_Reviewed by $PROVIDER ($MODEL)_" >> review.md
            echo "review_ok=true" >> $GITHUB_OUTPUT
          fi

      - name: Post Review Comment
        if: steps.check-key.outputs.has_key == 'true' && steps.review.outputs.review_ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const existing = comments.find(c => 
              c.body.includes('Custom LLM Review') && c.user.type === 'Bot'
            );
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Review Summary
        if: steps.check-key.outputs.has_key == 'true' && steps.review.outputs.review_ok == 'true'
        run: |
          echo "## Custom LLM Review ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Provider: ${{ env.AI_REVIEW_PROVIDER }}" >> $GITHUB_STEP_SUMMARY
          echo "Files: ${{ steps.diff.outputs.files_count }}" >> $GITHUB_STEP_SUMMARY
