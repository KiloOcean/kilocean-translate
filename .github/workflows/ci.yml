# Example caller for the reusable CI — copy to YOUR_REPO/.github/workflows/ci.yml
# and adjust the inputs. Trigger on `pull_request` (NOT pull_request_target):
# "Build & Test" executes the PR's code and must not see secrets.
#
# Required-check names produced by this example (job id `ci`, no `name:`):
#   - "ci / Build & Test"
#   - "ci / Secret Scan"
# If you rename the job id (or add a `name:`), the check names change to
# "<your job name> / <called job name>" — update branch protection AND
# auto-merge.yml's required_checks to match.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # Docs-only merges don't need a post-merge CI run (PR CI stays unfiltered:
    # a required check must never go missing on a PR).
    paths-ignore: ['**/*.md', 'docs/**']
  # Manual runs (Actions tab / `gh workflow run ci.yml --ref <branch>`).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: qianhaoq/devflow-gates/.github/workflows/ci.yml@42fdd49f44c69f4e748c6f8e9bf1ac2b0ffb18e2  # devflow-gates main @ 42fdd49 (方案 B; bump deliberately)
    with:
      node_version: '20'          # '' skips setup-node
      python_version: ''          # '' skips setup-python
      setup_command: ''     # '' skips the setup step
      test_command: 'node scripts/ci-check.mjs'    # required
      working_directory: '.'      # e.g. 'web' for a monorepo subdir
